name: CI

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Create .env from GitHub Secrets
        run: |
          cat > .env <<EOF
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          LINE_CLIENT_ID=${{ secrets.LINE_CLIENT_ID }}
          RESET_PASSWORD_CALLBACK=${{ secrets.RESET_PASSWORD_CALLBACK }}
          TWITTER_CLIENT_ID=${{ secrets.TWITTER_CLIENT_ID }}
          VIDEO_STREAM_BASE_URL=${{ secrets.VIDEO_STREAM_BASE_URL }}
          VIDEO_THUMBNAIL_BASE_URL=${{ secrets.VIDEO_THUMBNAIL_BASE_URL }}
          EOF

      - name: Lint
        run: npm run lint -- --max-warnings=9999

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --ci

  android-build:
    name: Android Debug Build
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push'
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Gradle + CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            ~/.cxx
          key: ${{ runner.os }}-android-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Install deps
        run: npm ci

      - name: Create .env from GitHub Secrets
        run: |
          cat > .env <<EOF
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          LINE_CLIENT_ID=${{ secrets.LINE_CLIENT_ID }}
          RESET_PASSWORD_CALLBACK=${{ secrets.RESET_PASSWORD_CALLBACK }}
          TWITTER_CLIENT_ID=${{ secrets.TWITTER_CLIENT_ID }}
          VIDEO_STREAM_BASE_URL=${{ secrets.VIDEO_STREAM_BASE_URL }}
          VIDEO_THUMBNAIL_BASE_URL=${{ secrets.VIDEO_THUMBNAIL_BASE_URL }}
          EOF

      - name: Grant gradlew permission
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build Android Debug APK (CI)
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --parallel \
            --build-cache \
            -Pci=true \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Gradle reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-reports
          path: |
            android/app/build/reports
            android/build/reports
          if-no-files-found: warn

  ios-build:
    name: iOS Debug Build (Simulator)
    runs-on: macos-latest
    needs: checks
    if: github.event_name == 'push'
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Create .env from GitHub Secrets
        run: |
          cat > .env <<EOF
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          LINE_CLIENT_ID=${{ secrets.LINE_CLIENT_ID }}
          RESET_PASSWORD_CALLBACK=${{ secrets.RESET_PASSWORD_CALLBACK }}
          TWITTER_CLIENT_ID=${{ secrets.TWITTER_CLIENT_ID }}
          VIDEO_STREAM_BASE_URL=${{ secrets.VIDEO_STREAM_BASE_URL }}
          VIDEO_THUMBNAIL_BASE_URL=${{ secrets.VIDEO_THUMBNAIL_BASE_URL }}
          EOF

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods -N

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS Debug (Simulator) - Workspace
        working-directory: ios
        run: |
          set -o pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED_DATA"

          xcodebuild \
            -workspace Hipsbook_App.xcworkspace \
            -scheme Hipsbook_App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/ResultBundle.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build | tee xcodebuild.log

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log
          path: ios/xcodebuild.log
          if-no-files-found: warn

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/ResultBundle.xcresult
          if-no-files-found: warn

      - name: Upload DerivedData Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-deriveddata-logs
          path: ${{ runner.temp }}/DerivedData/Logs
          if-no-files-found: warn
